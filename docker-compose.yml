x-environment: &environment
  MYSQL_HOST: db
  MYSQL_USER: root
  MYSQL_PASSWORD: root
  MYSQL_DB_LOG: db_log
  MYSQL_DB_AUTOREPORT: db_autoreport
  FALK_APP_ID: 80
  USERORGID: "nyre"
  SHINYPROXY_USERNAME: test@tester.no
  SHINYPROXY_USERGROUPS: "nyre"
  SHINYPROXY_APPID: "nyre"


services:
  db:
    image: mysql:9
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./dev/db:/docker-entrypoint-initdb.d

  dev:
    depends_on:
      - db
    image: rapporteket/rstudio:main
    volumes:
      - ~/.ssh:/home/rstudio/.ssh
      - ~/.gitconfig:/home/rstudio/.gitconfig
      - .:/home/rstudio/nyre
    ports:
      - "8787:8787"
    restart: "no"
    environment:
      << : *environment
      DISABLE_AUTH: "true"
      FALK_EXTENDED_USER_RIGHTS: "[{\\\"A\\\":80,\\\"R\\\":\\\"LC\\\",\\\"U\\\":1},{\\\"A\\\":80,\\\"R\\\":\\\"SC\\\",\\\"U\\\":2},{\\\"A\\\":81,\\\"R\\\":\\\"LC\\\",\\\"U\\\":2}]"

  adminer:
    depends_on:
      - db
    image: adminer
    restart: "no"
    environment:
      ADMINER_PLUGINS: frames
    ports:
      - 8888:8080
